const content={
 en:{title:'Privacy Policy',hero:'Your privacy, our priority.',thanks:'Thank you for your trust.',items:[['1. Information We Collect','Your name, email, verified phone number if you add one, age and emergency contacts if you provide them, language, home area, push notification token, photos and community reports you submit.'],['2. Location Information','Reports can include location. The public-location box is off by default. If you opt in, Exact shares the GPS pin with signed-in users who can view the report; Approximate shares the selected district only. If you leave it off, the report shares no location. Off mode also prevents location sharing.'],['3. How We Use Your Information','We use information to verify accounts, personalise language and area, show safety information and manage reports. Official alerts are managed by authorised administrators.'],['4. Service Providers','Relevant service providers support account, weather and map features.'],['5. Community Reports','Signed-in users can read community reports. Reports are visible to signed-in users. They show your description, chosen name or Anonymous setting and photos. Location is included only when you select the public-location box for that report.'],['6. Your Controls','Choose Exact, Approximate or Off in Profile, then decide separately on each report whether its location may be shown. Leave the report checkbox off to share only your description.'],['7. Policy Updates','This policy may be updated when the service changes.']]},
 si:{title:'පෞද්ගලිකත්ව ප්‍රතිපත්තිය',hero:'ඔබේ පෞද්ගලිකත්වය, අපගේ ප්‍රමුඛතාවය.',thanks:'ඔබේ විශ්වාසයට ස්තුතියි.',items:[['1. අප එකතු කරන තොරතුරු','ඔබගේ නම, ඊමේල්, සත්‍යාපිත දුරකථන අංකය (එක් කළහොත්), ඔබ සපයන වයස සහ හදිසි සම්බන්ධතා, භාෂාව, නිවසේ ප්‍රදේශය, push notification token, ඡායාරූප සහ ප්‍රජා වාර්තා.'],['2. ස්ථාන තොරතුරු','වාර්තාවකට ස්ථානයක් ඇතුළත් විය හැක. වාර්තාවේ ස්ථානය පෙන්වීමේ කොටුව මුලින් අක්‍රීයයි. ඔබ කැමැත්තෙන් තෝරුවොත් Exact GPS එක වාර්තාව බලන්න අවසර ඇති පිවිසි පරිශීලකයන්ට පෙන්වයි; Approximate තේරුවොත් තෝරාගත් දිස්ත්‍රික්කය පමණක් පෙන්වයි. කොටුව නොතේරුවොත් වාර්තාවට ස්ථානයක් එක් නොවේ. Off තේරීමෙන් ස්ථාන බෙදාගැනීම නවතී.'],['3. ඔබේ තොරතුරු භාවිතය','අපි ගිණුම් සත්‍යාපනය, භාෂාව සහ ප්‍රදේශ පෞද්ගලීකරණය, ආරක්ෂක තොරතුරු පෙන්වීම සහ වාර්තා කළමනාකරණය සඳහා තොරතුරු භාවිතා කරමු. රාජ්‍ය අනතුරු ඇඟවීම් බලයලත් පරිපාලකයින් විසින් කළමනාකරණය කරයි.'],['4. සේවා සපයන්නන්','ගිණුම්, කාලගුණ සහ සිතියම් විශේෂාංග සඳහා අදාළ සේවා සපයන්නන් භාවිතා වේ.'],['5. ප්‍රජා වාර්තා','පිවිසි පරිශීලකයන්ට ප්‍රජා වාර්තා කියවිය හැක. වාර්තා පිවිසි පරිශීලකයන්ට පෙනේ. විස්තරය, තෝරාගත් නම හෝ නිර්නාමික තේරීම සහ ඡායාරූප පෙන්වයි. ස්ථානය එක් වන්නේ ඒ වාර්තාවේ public-location කොටුව ඔබ තෝරාගත් විට පමණි.'],['6. ඔබේ පාලනය','Profile තුළ Exact, Approximate හෝ Off තෝරා, එක් එක් වාර්තාවට ස්ථානය පෙන්විය යුතුද වෙනම තීරණය කරන්න. විස්තරය පමණක් බෙදාගැනීමට කොටුව නොතෝරන්න.'],['7. ප්‍රතිපත්ති යාවත්කාලීන','සේවාවේ වෙනස්කම් අනුව මෙම ප්‍රතිපත්තිය යාවත්කාලීන විය හැක.']]},
 ta:{title:'தனியுரிமைக் கொள்கை',hero:'உங்கள் தனியுரிமை, எங்கள் முன்னுரிமை.',thanks:'உங்கள் நம்பிக்கைக்கு நன்றி.',items:[['1. சேகரிக்கும் தகவல்','உங்கள் பெயர், மின்னஞ்சல், மொழி, வீட்டு பகுதி மற்றும் நீங்கள் சமர்ப்பிக்கும் சமூக அறிக்கைகள்.'],['2. இருப்பிடத் தகவல்','இருப்பிட அம்சங்களைப் பயன்படுத்தும்போது உங்கள் அனுமதியுடன் இருப்பிடத் தகவல் பயன்படுத்தப்படலாம்.'],['3. தகவல் பயன்பாடு','கணக்கைச் சரிபார்க்கவும், மொழி மற்றும் பகுதியைத் தனிப்பயனாக்கவும், பாதுகாப்புத் தகவலைக் காட்டவும், அறிக்கைகளை நிர்வகிக்கவும் தகவலைப் பயன்படுத்துகிறோம். அதிகாரப்பூர்வ எச்சரிக்கைகள் அங்கீகரிக்கப்பட்ட நிர்வாகிகளால் நிர்வகிக்கப்படுகின்றன.'],['4. சேவை வழங்குநர்கள்','கணக்கு, வானிலை மற்றும் வரைபட அம்சங்களுக்கு தொடர்புடைய சேவை வழங்குநர்கள் உதவுகின்றனர்.'],['5. சமூக அறிக்கைகள்','நீங்கள் சமர்ப்பிக்கும் அறிக்கைகள் சேவையில் காண்பிக்கவும் நிர்வகிக்கவும் பயன்படுத்தப்படுகின்றன.'],['6. உங்கள் கட்டுப்பாடு','மொழி மற்றும் பகுதியை மாற்றவும் இருப்பிட அனுமதியை மறுக்கவும் முடியும்.'],['7. கொள்கை புதுப்பிப்பு','சேவை மாறும்போது இந்தக் கொள்கை புதுப்பிக்கப்படலாம்.']]}};
const months={en:['January','February','March','April','May','June','July','August','September','October','November','December'],si:['ජනවාරි','පෙබරවාරි','මාර්තු','අප්‍රේල්','මැයි','ජූනි','ජූලි','අගෝස්තු','සැප්තැම්බර්','ඔක්තෝබර්','නොවැම්බර්','දෙසැම්බර්'],ta:['ஜனவரி','பிப்ரவரி','மார்ச்','ஏப்ரல்','மே','ஜூன்','ஜூலை','ஆகஸ்ட்','செப்டம்பர்','அக்டோபர்','நவம்பர்','டிசம்பர்']};
function render(){const lang=getLang(),c=content[lang]||content.en;document.documentElement.lang=lang;document.getElementById('privacyTitle').textContent=c.title;document.getElementById('privacyHero').textContent=c.hero;document.getElementById('privacyThanks').textContent=c.thanks;document.querySelectorAll('#privacyPolicyGrid .policy-card').forEach((card,i)=>{card.querySelector('h3').textContent=c.items[i][0];card.querySelector('p').textContent=c.items[i][1]});const d=new Date(),m=months[lang]||months.en;document.getElementById('privacyUpdated').textContent=lang==='si'?`යාවත්කාලීන කළ දිනය: ${d.getFullYear()} ${m[d.getMonth()]} ${d.getDate()}`:lang==='ta'?`புதுப்பிக்கப்பட்ட தேதி: ${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()}`:`Last updated: ${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()}`;applyTranslations(lang)}
window.laRenderIcons?.(document);render();window.addEventListener('lankaalert:language',render);
</script>
